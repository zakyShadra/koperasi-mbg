<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Koperasi MBG</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Redirects deep links (e.g. /koperasi-mbg/manager) to the app root
      // with the path encoded in the query string, so the SPA can restore it.
      var pathSegmentsToKeep =
        window.location.hostname === 'zakyshadra.github.io' ? 1 : 0;
      var segments = window.location.pathname.slice(1).split('/');
      if (pathSegmentsToKeep === 0 && segments[0] === 'koperasi-mbg')
        segments.shift();
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          segments
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
